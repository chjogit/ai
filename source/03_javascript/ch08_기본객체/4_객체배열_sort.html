<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <script>
        function Student(name, kor, eng, mat) {
            this.name = name;
            this.kor = kor;
            this.eng = eng;
            this.mat = mat;
        }

        // 메소드는 prototype에 추가
        Student.prototype.getSum = function(){
            return this.kor + this.mat + this.eng;
        };
        Student.prototype.getAvg = function(){
            return (this.getSum() / 3).toFixed(1);
        };
        Student.prototype.toString = function(){
            let output = '';
                for(let key in this){
                    if (key!='getSum' && key!='getAvg' && key!='toString'){
                        output += key + ' : ' + this[key] + ' &nbsp; ';
                    } else if(key=="getAvg" || key=="getSum"){
                        output += key.substring(3).toUpperCase() + ' : ' + this[key]() + ' &nbsp; ';
                    } // if
                }; // for
            return output;
        };

        let students = [];
        students.push(new Student('홍길동', 99, 98 , 90));
        students.push(new Student('마길동', 98, 90 , 93));
        students.push(new Student('김길동', 96, 92 , 92));
        students.push(new Student('이길동', 92, 95 , 94));
        students.push(new Student('박길동', 90, 99 , 91));
        students.push(new Student('최길동', 91, 90 , 90));

        document.write('<h3>원본</h3>');
        students.forEach(data => document.write(data + '<br>'));
        
        students.sort(); //toString 결과를 ascii 코드로 오름차순 정렬 
        document.write('<h3>이름 순 정렬</h3>');
        students.forEach(data => document.write(data + '<br>'));

        // 총점 기준으로 내림차순 정렬
        document.write('<h3>총점 기준으로 내림차순 정렬</h3>');
        students.sort((left, right) => {
            return right.getSum() - left.getSum();
        });
        // 정렬된 데이터 출력
        students.forEach(data => document.write(data + '<br>'));
        // top3 출력
        document.write('<h3>총점 기준 top 3 출력</h3>');
        let top3 = students.slice(0, 3);
        top3.forEach(data => document.write(data + '<br>'));
    </script>
</head>

</body>
</html>
