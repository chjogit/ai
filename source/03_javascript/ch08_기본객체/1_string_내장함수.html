<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <script>
        let str = "   abc@ ABC @  "; //
        document.write('원본 : ' + str + '<br>');
        document.write('글자 수 length : ' + str.length + '<br>');
        document.write('글자 연결 concat : ' + str.concat('뒷부분') + '<br>');

        // substring(n) : n번째 idx부터 끝까지 추출
        document.write('글자 추출 substring 1 : ' + str.substring(4) + '<br>');

        // substring(n, m) : n번째 idx부터 m번째 idx 앞까지 추출
        document.write('글자 추출 substring 2 : ' + str.substring(3, 6) + '<br>');

        // subst(n, m) : n번째 idx부터 n+m번째 idx 앞까지 추출
        document.write('글자 추출 substr : ' + str.substr(3, 6) + '<br>');

        // indexOf('@') : 0번째 idx에서부터 @가 있는 idx 추출, 없을 경우 -1 반환
        document.write('글자 인덱스 확인 1 : ' + str.indexOf('@') + '<br>');
        document.write('글자 인덱스 확인 2 : ' + str.indexOf('!') + '<br>'); // -1
        
        // lastIndexOf('@') : 0번째 idx에서부터 @가 있는 idx 추출
        document.write('글자 인덱스 확인 3 : ' + str.lastIndexOf('@')+ '<br>');

        // trim() : 앞과 뒤의 space 공백 제거
        document.write('글자 앞뒤 공백 제거 : ' + str.trim() + '<br>');

        // toUpperCase() : 대문자로 변경
        document.write('대문자로 변경 : ' + str.toUpperCase() + '<br>');

        // toLowerCase() : 소문자로 변경
        document.write('소문자로 변경 : ' + str.toLowerCase() + '<br>');

        // replace('m','n') : 첫번째 n을 m으로 수정
        document.write('글자 수정 : ' + str.replace('@','#') + '<br>');

        // replaceAll('m','n') : 모든 n을 m으로 수정
        document.write('글자 수정 : ' + str.replaceAll('@','#') + '<br>');

        // replaceAll('m','n') : 모든 space 공백 제거
        document.write('글자 수정 : ' + str.replaceAll(' ','') + '<br>');
    </script>
</head>
<body>
    
</body>
</html>
