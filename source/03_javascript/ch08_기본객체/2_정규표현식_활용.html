<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        var str= 'abcd@ef';

        // 정규표현식패턴 형식
        var patternNum = /[0-9]/;
        var patternEng = /[a-zA-Z]/;
        var patternUpp = /[A-Z]/;
        var patternLow = /[a-z]/;
        var patternKor = /[가-힣]/;
        var patternSpe = /[~`!@#$%^&*()_\-\\\|+=*;:'"{}[\]\<>?\.,]/;
        var patternEmail = /^\w+@\w+(\.\w+){1,2}$/g;

        // 정규표현식패턴.test(str) : str에 정규표현식 패턴이 포함되어 있는지 여부 확인 (T/F)
        document.write('str에 숫자 포함여부 :'+ patternNum.test(str) + '<br>');
        document.write('str에 영어 포함여부 :'+ patternEng.test(str) + '<br>');
        document.write('str에 한글 포함여부 :'+ patternKor.test(str) + '<br>');
        document.write('str에 특수문자 포함여부 :'+ patternSpe.test(str) + '<br>');
        document.write('str에 소문자 포함여부 :'+ patternLow.test(str) + '<br>');
        document.write('str에 대문자 포함여부 :'+ patternUpp.test(str) + '<br>');

        var str1 = 'hong@hong.com';
        var str2 = 'hong@hong.com@abc';

        if(patternEmail.test(str1)) {
            document.write('str1은 이메일 형식입니다.<br>');
        } else {
            document.write('str1은 이메일 형식이 아닙니다.<br>');
        }

        if(patternEmail.test(str2)) {
            document.write('str2은 이메일 형식입니다.<br>');
        } else {
            document.write('str2은 이메일 형식이 아닙니다.<br>');
        }

        // str.match(정규표현식패턴) : str이 정규표현식 패턴과 일치하는지 여부 확인
        // 정규표현식과 매칭되는 문자열과 캡쳐그룹(괄호 안)을 배열 후 return '[매칭되는 문자열],[캡쳐그룹]'
        // 정규표현식과 일치하지 않을 경우 null return

        if(str1.match(patternEmail)){
            document.write('str1은 이메일 형식입니다.<br>');
        } else {
            document.write('str1은 이메일 형식이 아닙니다.<br>');
        }

        if(str2.match(patternEmail)){
            document.write('str2은 이메일 형식입니다.<br>');
        } else {
            document.write('str2은 이메일 형식이 아닙니다.<br>');
        }
    </script>
</head>
<body>
    
</body>
</html>
