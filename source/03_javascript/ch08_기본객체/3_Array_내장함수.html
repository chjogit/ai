<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <script>
        var arr1 = ['zoo', 'hong', 'kim'];
        var arr2 = [52, 18, 36, 100, 78];

        document.write('arr1 연결 : ' + arr1.join(' - ') + '<br>'); // 배열 연결

        // 배열명.slice(n, m) : 배열의 n번째 idx부터 m번째 idx 앞까지 복제한 배열 return
        // 배열명.slice(n) : 배열의 n번째 idx부터 끝까지 복제한 배열 return
        // 배열명.slice() : 배열의 깊은 복사
        let originArr1 = arr1.slice();  // 깊은 복사 1
        originArr1 = [...arr1];         // 깊은 복사 2
        originArr1 = Array.from(arr1);  // 깊은 복사 3

        arr1.sort(); // ascii코드 순으로 오름차순 정렬
        document.write('arr1' + '<br>');
        document.write('정렬 전 : ' + originArr1 + '<br>');
        document.write('정렬 후 : ' + arr1 + '<br>');

        arr1.reverse(); // 배열의 역순 나열
        document.write('역순 나열 후  : ' + arr1 + '<br>');
        
        document.write('<hr>arr2' + '<br>');
        document.write('정렬 전  : ' + arr2 + '<br>');
        arr2.sort(function(left, right){ // (2) (1)의 결과를 방지하기 위한 함수 작성
            // return left-right; // 오름차순 정렬 : left - right의 결과가 음수일 경우 left를 앞으로 이동
            return right-left; // 내림차순 정렬 : right - left의 결과가 양수일 경우 right를 앞으로 이동
        }); 
        document.write('정렬 후 : ' + arr2 + '<br>'); // (1) 100 18 36 52 78 - ascii코드 순으로 오름차순 정렬

        let top3 = arr2.slice(0, 3);
        document.write('arr2 top3  : ' + top3 + '<br>');        
</script>
</head>
<body>
    
</body>
</html>
