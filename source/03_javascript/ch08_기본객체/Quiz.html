<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        table {
            width: 350px;
            margin: 20px auto;
            padding: 20px 10px;
        }

        table,
        input[type="text"],
        input[type="password"] {
            border: 1px solid #385d81;
            outline: 1px solid #385d81;
            padding: 2px;
        }

        input[type="submit"],
        input[type="reset"],
        input[type="button"],
        button {
            background-color: #385d81;
            border: 0;
            outline: 0;
            color: white;
            border-radius: 3px;
            padding: 10px 20px;
            margin: 5px;
        }

        td,
        th {
            padding: 5px 10px;
            text-align: center;
        }
    </style>
    <script>
        const joinCheck = () => {
            var patternName = /[~`!@#$%^&*()_\-\\\|+=*;:'"{}[\]\<>?\.,0-9]/
            var patternMail = /^\w+@\w+(\.\w+){1,2}$/;
            var patternSpe = /[~`!@#$%^&*()_\-\\\|+=*;:'"{}[\]\<>?\.,]/;
            var patternUpp = /[A-Z]/;
            var patternLow = /[a-z]/;
            var patternNum = /[0-9]/;

            let name = frm.name.value.trim();
            let mail = frm.mail.value.trim();
            let pw = frm.pw.value.trim();
            let pwChk = frm.pwChk.value.trim();

            if (patternName.test(name)) {
                alert("이름은 숫자와 특수문자를 포함할 수 없습니다.");
                frm.name.value = "";
                frm.name.focus();
                return false;
            }

            if (!patternMail.test(mail)) {
                alert("옳지 않은 이메일 형식입니다.");
                frm.mail.value = "";
                frm.mail.focus();
                return false;
            }

            if (!patternLow.test(pw) || !patternUpp.test(pw) || !patternNum.test(pw) || !patternSpe.test(pw)) {
                alert("옳지 않은 비밀번호 형식입니다.");
                frm.pw.value = "";
                frm.pwChk.value = "";
                frm.pw.focus();
                return false;
            }

            if (pw != pwChk) {
                alert("비밀번호를 확인하세요.");
                frm.pw.value = "";
                frm.pwChk.value = "";
                frm.pw.focus();
                return false;
            }

            return true;
        }
    </script>
</head>

<body>
    <form action="#" name="frm" onsubmit="return joinCheck();">
        <table>
            <tr>
                <th>이 름</th>
                <td>
                    <input type="text" name="name" placeholder="특수문자와 숫자 사용 불가" autofocus="autofocus" autocomplete="off"
                        required="required" minlength="2" />
                </td>
            </tr>
            <tr>
                <th>메 일</th>
                <td>
                    <input type="text" name="mail" placeholder="메일 형식에 맞추세요" />
                </td>
            </tr>
            <tr>
                <th>비밀번호</th>
                <td>
                    <input type="password" name="pw" placeholder="특수문자, 알파벳, 숫자 포함"  required="required" minlength="4"/>
                </td>
            </tr>
            <tr>
                <th>비밀번호</th>
                <td><input type="password" name="pwChk" placeholder="****" /></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="회원가입" />
                    <input type="reset" value="취소" />
                    <input type="button" value="로그인" />
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
