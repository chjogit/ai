<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title>Tag 활용</title>
    <script>
        onload = () => {
            var header = document.getElementsByTagName('h1'); // 유사 배열 객체 return
            for (var idx=0 ; idx<header.length ; idx++) {
                header[idx].innerHTML = '내용 변경 #' + idx;
            }
            // for (idx in header) {
            //     header[idx].innerHTML = '내용 변경 #' + idx;
            // }
            // for (var data of header) {
            //     data.innerHTML = '내용 변경';
            // }
            // header.forEach(element => { ** 유사 배열 객체의 경우 forEach 사용 불가
            //     element.innerHTML = '내용 변경 #';
            // });
        };
    </script>
</head>
<body>
    <h1>HEADER</h1>
    <h1>HEADER</h1>
    <h1>HEADER</h1>
    <h1>HEADER</h1>
    <h1>HEADER</h1>
</body>
</html>
