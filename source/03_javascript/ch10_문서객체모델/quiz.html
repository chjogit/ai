<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <style>
        table {width:280px; height: 100px; margin: 10px auto;} h3{text-align:center;}
    </style>
    <script>
        let color = ['red', 'orange', 'yellow', 'green', 'blue', 'navy', 'purple'];;
        let td;

        onload = () =>{
            color;
            td = document.querySelectorAll('td');
            for(let idx in td) {
                td[idx].style = 'background-color:' + color[idx];
            }
        };

        const bgColorChange = n => {
            // document.body.innerHTML+= n; //test
            if (n!=7) {
                document.body.style.backgroundColor = color[n];
            } else {
                document.body.style.backgroundColor = 'white';
            }
        };

    </script>
</head>
<body>
    <h3>quiz: 마우스를 올리면 바탕화면도 해당 색상으로</h3>
    <table>
        <tr onmouseout="bgColorChange(7)">
            <td onmouseover="bgColorChange(0)" class="red"></td>
            <td onmouseover="bgColorChange(1)" class="org"></td>
            <td onmouseover="bgColorChange(2)" class="yel"></td>
            <td onmouseover="bgColorChange(3)" class="gre"></td>
            <td onmouseover="bgColorChange(4)" class="blu"></td>
            <td onmouseover="bgColorChange(5)" class="nav"></td>
            <td onmouseover="bgColorChange(6)" class="pup"></td>
        </tr>
    </table>
</body>
</html>
