<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
    <title>INDEX</title>
    <script>
        onload = () => {
            // 문서 객체 생성 방법 1 : h1 생성 - textnode 생성 - h1 append - body append
            var h1 = document.createElement('h1');
            var textNode = document.createTextNode('방법 1 - h1 태그 내부의 text')
            h1.appendChild(textNode);
            document.body.appendChild(h1);

            // 문서 객체 생성 방법 2 : img 생성 - img 태그의 src 속성 변경 - body append
            var img = document.createElement('img');
            img.setAttribute('src', 'ch10_img/red.jpg');
            img.setAttribute('alt', '체리');
            document.body.appendChild(img);

            // 문서 객체 생성 방법 3 : body.insertAdjacentHTML/innerHTML 활용
            // 안전하고 간결한 작성법 (기존 DOM 유지)
            document.body.insertAdjacentHTML('beforeend', '<h1>방법 3 - insertAdjacentHTML</h1>');
        };
    </script>
</head>
<body>
    <h1>TEXT NODE</h1>
    <img src="ch10_img/orange.jpg" alt="오렌지" />
</body>
</html>
