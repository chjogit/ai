<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <title>ID 활용</title>
    <script>
        var clock, btn;
        var timerId;
        var timerToggle = 1;
        onload = () =>{
            // # clock에 1초 마다 시간 출력
            clock = document.getElementById('clock');
            btn = document.getElementById('btn');
            clock.innerHTML = new Date().toLocaleString();
            timerId = setInterval(() => {
                clock.innerHTML = new Date().toLocaleString();
            }, 1000);
        };
        const toggleFunction = () => {
            // 타이머가 가동 중이면 멈추고, 타이머가 멈춰있으면 가동시키기
            if(timerToggle) {
                timerToggle = 0;
                btn.innerHTML = '타이머 멈춤';
                // 타이머 멈춤
                clearInterval(timerId);
                clock.innerHTML = new Date().toLocaleString();
                clock.style.backgroundColor = 'yellow';
                clock.style.color = 'red';
            } else {
                timerToggle = 1;
                btn.innerHTML = '타이머 가동 중';
                // 타이머 재가동
                clock.innerHTML = new Date().toLocaleString();
                timerId = setInterval(() => {
                    clock.innerHTML = new Date().toLocaleString();
                }, 1000);
                clock.style.backgroundColor = '';
                clock.style.color = 'black';
            }
        };
        
    </script>
</head>
<body>
    <h1>날짜와 시간</h1>
    <h1 id="clock">날짜와 시간을 출력할 공간</h1>
    <button id="btn" onclick="toggleFunction()">타이머 가동 중</button>
</body>
</html>
