<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        #wrap {width : 450px; margin : 0 auto;}
        #wrap input[type="text"] {width : 150px; height : 20px; display : inline-block; 
        border : 1px solid gray; text-align : center; margin: 0 10px;}
        #wrap p {text-align:center;}
    </style>
    <script>
        onload = () => {
            var idCfm = document.querySelector('#idCfm');
            idCfm.onclick = () => {
                var win = open('5_confirm.html','','width=500, height=600, left=750, top=250');
                if(!win){ alert ('팝업 해제');}
            };
        };
    </script>
</head>
<body>
    <div id="wrap">
        <form method="get">
            <p>아이디<input type="text" name="id" id="id" /><input type="button" id="idCfm" value="중복확인"></p>
            <p><input type="submit" value="회원가입"></p>
        </form>
    </div>
</body>
</html>
