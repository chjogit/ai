<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="css/join.css" rel="stylesheet">
	<!-- $('#id')의 keyup 이벤트에 $.ajax()구현 -->
	<!-- $('#pw, #pwChk)의 keyup 이벤트에 두 비밀번호 체크 -->
	<!-- $('form')의 submit 이벤트에 유효성 검사(#idConfirmResult, #pwChkResult) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelector('input[name=id]').addEventListener("keyup", function(){
				let idConfirmResult = document.querySelector('#idConfirmResult');
                let id = this.value;
                if(id.length<2){
                    idConfirmResult.textContent = '아이디는 2글자 이상 입력하세요.';
                }else{
                    let params = new URLSearchParams({id:id});
                    fetch(`midConfirmNonExists.html?${params}`, {method:'get'})
                    .then((response)=>{
                        if (!response.ok) {
                            throw new Error(`서버 응답 오류 : ${response.status}`);
                        }
                        return response.text();
                    }) // fetch-response
                    .then((data)=>{ 
                        document.querySelector('div#idConfirmResult').textContent = data.trim();
                    }) // fetch-response-data
                    .catch((error)=>{
                        alert(error.message);
                    }); // fetch-response-error
                    } // if
            }); // keyup

			document.querySelector('input[name=pwChk]').addEventListener("keyup", function(e){
				let pwChkResult = document.querySelector('#pwChkResult');
				let pw = document.querySelector('input[name=pw]');
				let pwChk = document.querySelector('input[name=pwChk]');
                if (!pw.value){
                    pwChkResult.textContent ='비밀번호를 입력하세요.';
                    pw.focus();
                    e.preventDefault();  // 디폴트 이벤트 제한
                } else if (pw.value != pwChk.value) {
                    pwChkResult.textContent ='비밀번호가 다릅니다.';
                    e.preventDefault();  // 디폴트 이벤트 제한
                } else {
					pwChkResult.textContent ='동일한 비밀번호 입니다.';
					fetch(`pwChkResult.html?${params}`, {method:'get'})
                    .then((data)=>{ 
                        document.querySelector('div#pwChkResult').textContent = data.trim();
                    }) // fetch-response-data
                    .catch((error)=>{
                        alert(error.message);
                    }); // fetch-response-error
                } // if
				return true;
            });

			document.querySelector('form').addEventListener("submit", (e) => {
				let patternSpe = /[~`!@#$%^&*()_\-\\\|+=*;:'"{}[\]\<>?\.,]/;
				let patternUpp = /[A-Z]/;
				let patternLow = /[a-z]/;
				let patternNum = /[0-9]/;

				if (!patternLow.test(pw) || !patternUpp.test(pw) || !patternNum.test(pw) || !patternSpe.test(pw)) {
					alert("옳지 않은 비밀번호 형식입니다.");
					frm.pw.value = "";
					frm.pwChk.value = "";
					frm.pw.focus();
					e.preventDefault(); 
				}
				return true;
			});
			
        }); // DOM



    </script>
</head>

<body>
	<div id="joinForm_wrap">
		<form>
			<div id="join_title">회원가입</div>
			<table>
				<tr>
					<th><label for="id">아이디</label></th>
					<td>
						<input type="text" name="id" id="id" class="id" required="required" autocomplete="off">
					</td>
				</tr>
				<tr>
					<th></th>
					<td><div id="idConfirmResult">아이디는 2글자 이상 입력하세요.</div></td>
				</tr>
				<tr>
					<th><label for="pw">비밀번호</label></th>
					<td><input type="password" name="pw" id="pw" class="pw"></td>
				</tr>
				<tr>
					<th><label for="pwChk">비밀번호확인</label></th>
					<td>
						<input type="password" name="pwChk" id="pwChk" class="pwChk">
					</td>
				</tr>
				<tr>
					<th></th>
					<td><div id="pwChkResult"> 비밀번호를 재입력해주세요. </div></td>
				</tr>
				<tr>
					<th><label for="name">이름</label></th>
					<td><input type="text" name="name" id="name" class="name" required="required"></td>
				</tr>
				<tr>
					<th>생년월일</th>
					<td><input type="date" name="birth" id="datepicker" class="birth" autocomplete="off"></td>
				</tr>
				<tr>
					<td colspan="2">
						<input type="submit" value="가입하기" class="joinBtn_style">
						<input type="reset" value="다시하기" class="joinBtn_style">
						<input type="button" value="로그인" class="joinBtn_style">
					</td>
				</tr>
			</table>
		</form>
	</div>
</body>

</html>
