<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelector('button').addEventListener("click", function () {
                let id = document.querySelector('input[name=id]').value;

                let params = new URLSearchParams({id:id});

                // fetch : 비동기 작업의 결과를 약속함
                fetch(`midConfirmNonExists.html?${params}`, {method:'get'})
                .then(function(response){
                    //      - response 결과값 확인 : true / 200 / OK
                    // document.body.innerHTML += `${response.ok} / ${response.status} / ${response.statusText}`;
                    if (!response.ok) { // response.ok >>> t/f
                        throw new Error(`서버 응답 오류 : ${response.status} / ${response.statusText}`);
                    }
                    return response.text(); // response에서 html text만 반환
                }) // fetch-response
                .then(function(data){
                    document.querySelector('span#idConfirmResult').innerHTML = data;
                }) // fetch-response-data
                .catch(function(error){
                    alert(error.message);
                }); // fetch-response-error
            }); // button click
        }); // DOM
    </script>
</head>
<body>
    아이디 <input type="text" name="id" autocomplete="off" autofocus="autofocus"> <button>중복 체크</button>
    <br>
    <span id="idConfirmResult"></span>
</body>
</html>
