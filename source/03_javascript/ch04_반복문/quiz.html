<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        table {
            margin: 100px auto;
            border-collapse: collapse;
        }

        table td {
            padding: 10px;
            border: 1px solid gray;
            text-align: center;
        }

        table tr td:first-child{
            font-weight: bold;
        }
    </style>
    <script>
    let cnt = 0;
    let sum = 0;
    let tr_cnt = 0;
    let fs_cnt = 0;

    do{
        var ans = confirm('누적할래?');    
            if (ans == true) {
                let num1 = 0;
                do{
                    cnt += 1;
                    var num = prompt('누적할 점수?'); 
                    num1 = Number(num);
                    if (num && num.trim() && !isNaN(num1) && num1 >= 0 && num1 <= 100) {
                            tr_cnt += 1;
                    } else {
                        num1 = null;
                        fs_cnt += 1;
                    }
                }while(num === null);
                sum += num1;
                
            } else {
                document.write(`<table><tr><td colspan="2">${cnt}번 입력</td></tr>
                <tr><td>누적점수</td><td>${sum}</td></tr>
                <tr><td>점수를 제대로 입력한 횟수</td><td>${tr_cnt}</td></tr>
                <tr><td>점수를 잘못 입력한 횟수</td><td>${fs_cnt}</td></tr>`);
            }
    }while(ans == true)
    </script>
</head>
<body>
    
</body>
</html>
