<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        h1 {
            cursor: pointer;
            width: 150px;
            text-align: center;
        }
    </style>
    <script>
        onload = () => {
            var header = document.querySelector('h1');
            var cnt = 0;
            for (let key in header) {
                if (key == 'onclick') {
                    // 기존 DOM을 파괴하지 않고 body 맨 뒤에 HTML을 삽입합니다.
                    document.body.insertAdjacentHTML('beforeend', `${++cnt}.${key} : ${header[key]}<br>`);
                }
            }
            // 기본 이벤트 모델 : 이벤트 속성에 메서드 할당
            // on으로 시작하는 속성 : 이벤트 속성
            // 이벤트 이름 : click
            // 이벤트 리스너 함수 : 이벤트 속성에 할당된 함수
            header.onclick = function () {
                // this : 이벤트가 발생한 엘리먼트 객체. this 사용 시 화살표 함수 사용 불가
                this.textContent = 'clicked';
                this.style.color = 'red';
                this.style.border = '1px solid orange';
            };
        };
    </script>
</head>

<body>
    <h1>click</h1>
</body>

</html>
