<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        h1{cursor: pointer; width : 150px; text-align: center;}
    </style>
    <script>
        // 이벤트 이름 : click
        // 이벤트 속성 변수 : onclick
        const whenClick = () => {
            var h1 = document.querySelector('h1');
            h1.textContent = 'clicked';
            h1.style.color = 'red';
            h1.style.border = '1px solid orange';
        };
    </script>
</head>
<body>
    <!-- 인라인 이벤트 / 리스너 함수 : whenClick() -->
    <h1 onclick="whenClick()">click</h1>
</body>
</html>
