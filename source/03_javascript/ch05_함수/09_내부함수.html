<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script> /* A가 만든 부분 - 가로 세로 길이를 통해 빗변 길이 확인 */
        function pythagoras(width, height) {
            // 내부 함수 : 함수 내에 구현된 함수
            // - 같은 이름으로 지정된 변수끼리의 충돌을 방지함
            let square = x => x*x;
            return Math.sqrt(square(width) + square(height));
        }
    </script>
    <script> /* B가 만든 부분 - 직각삼각형 여부 확인 */
        function square(width, height, hypotenuse) {
            return width ** 2 + height ** 2 == hypotenuse ** 2;
        }
    </script>
</head>
<body>
    <script>
        document.write(`빗변의 길이 : `+ pythagoras(3,4) + '<br>');
        document.write(`직각삼각형 여부 : `+ square(3,4,5));
    </script>
</body>
</html>
