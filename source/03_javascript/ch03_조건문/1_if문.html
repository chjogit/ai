<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        img {width: 300px;}
    </style>
    <script>
        //const date = new Date(); // new : 객체 생성 명령어, Date() : 현재 날짜와 시간 정보 객체
        //const hour = date.getHours();
        const hour = new Date().getHours();
        if(hour<12){
            document.write('상쾌한 오전입니다.<br>')
            document.write('<img src="ch03_img/am.jpg">');
        } else if(12<=hour && hour<18) {
            document.write('더운 오후입니다.<br>')
            document.write('<img src="ch03_img/pm.jpg">');
        } else {
            document.write('좋은 밤 되세요.')
        }
    </script>
</head>

</body>
</html>
