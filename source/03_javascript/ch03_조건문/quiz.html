<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        p {
            text-align: center;
            font-size: 1.5em;
        }
        table {
            border: 1px solid gray;
            padding: 20px;
            margin: 5px auto;
            line-height: 30px;
            text-align: center;
        }
        table tr input[type="number"] {
            text-align: center;
            margin-left: 20px;
            width : 150px;
            font-size: 1.3em;
        }
        table th input[type="submit"] {
            margin-top: 10px;
            padding: 0 15px 0 15px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: rgb(194, 193, 193);
            border: 1px solid black;
        }
    </style>
    <script>
        function chk(){
            let num1 = parseInt(frm.num1.value);
            let num2 = parseInt(frm.num2.value);
            let difference = (num1>num2) ? num1-num2 : num2-num1;
            let msg = (num1>num2) ? `첫번째 수가 ${difference} 큽니다.`:
                (num2>num1) ? `두번째 수가 ${difference} 큽니다.` :
                    '두 수는 같습니다.';
            alert(msg);
            document.body.innerHTML += `<p>${msg}</p>`;
            frm.num1.value = num1;
            frm.num2.value = num2;
            return false;
        };
    </script>
</head>
<body>
    <form name="frm" onsubmit="return chk()">
        <table>
            <tr>
                <td>첫번째수</td>
                <td><input type="number" name="num1" required="required"></td>
            </tr>
            <tr>
                <td>두번째수</td>
                <td><input type="number" name="num2" required="required"></td>
            </tr>
            <tr>
            <th colspan="2"><input type="submit" value="결과"></th>
            </tr>
        </table>
    </form>
</body>
</html>
