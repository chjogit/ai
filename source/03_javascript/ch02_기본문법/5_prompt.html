<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        var scoreStr = prompt("점수를 입력하세요.", "0"); // 확인 : string (default:0) return, 취소 : null return
        if(!scoreStr) { // if(scoreStr===null || scoreStr===''){}와 동일
            alert('점수를 입력하세요.');
        } else{
            let score = Number(scoreStr); //string>>>number 형변환. 불가할 경우 NaN. '' or null의 경우 0. 
            score = parseInt(scoreStr); // '100점', '100'의 경우 int 형변환. '' or null의 경우 NaN. 
            document.write("입력한 점수 : " + score + " - 타입 : " + typeof(score) + '<br>');
            if(isNaN(score)){ // score == NAN 여부 확인
                alert('정수를 입력하세요');
            } else {
                result = score > 80? '잘했어요':'못했어요'; // 삼항연산자 - 변수 = 조건문? 'true value':'false value';
                document.write(result);
            }
        }
    </script>
</head>
<body>
    
</body>
</html>
