<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style></style>
    <script>
        let person = {
            name : '홍길동',
            age : 20,
            eat : function (food) {
                alert(`${this.name}이 ${food}을(를) 먹습니다.`);  
            }   // 화살표 함수 사용 시 'this.var'가 객체 자신이 아닌 상위 스코프를 가리킴
                // 객체의 메소드 생성 시, 화살표 함수 사용 지양
        };
        person.eat('빵');
        document.write(person.name+ '님' + '<br>' + person['name'] + '<br>');
        document.write(person.age + '세<br>');
        document.write(person.eat + '<br>');
        document.write(person + '<br>');
        document.write(person.toString() + '<br>')
    </script>
</head>
<body>
    
</body>
</html>
