<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style></style>
    <script>
        let students = [
            {name:'김', kor:90, mat:98, eng:95},
            {name:'이', kor:99, mat:88, eng:91},
            {name:'박', kor:90, mat:93, eng:95},
            {name:'정', kor:90, mat:98, eng:94},
        ];
        students.push({name:'윤', kor:85, mat:78, eng:83})

        for(let idx in students) {
            students[idx].getSum = function (){
                return this.kor + this.mat + this.eng;
            };
            students[idx].getAvg = function (){
                return (this.getSum() / 3).toFixed(1);
            };                              // 소수점 첫번째 자리로 반올림
            students[idx].toString = function(){
                let output = '';
                for(let key in this){
                    if (key!='getSum' && key!='getAvg' && key!='toString'){
                        output += key + ' : ' + this[key] + ' &nbsp; ';
                    } else if(key=="getAvg" || key=="getSum"){
                        output += key.substring(3).toUpperCase() + ' : ' + this[key]() + ' &nbsp; ';
                    } // if            // idx 3번째부터 끝까지
                } // for
                return output;
            };
        }
        
        document.write('<h4>1. 일반 for문</h4>')
        for(let idx=0 ; idx<students.length ; idx++) {
            document.write(`${idx}번째 ${students[idx]}<br>`)
        }

        document.write('<h4>2. for-in문</h4>')
        for(let idx in students) {
            document.write(`${idx}번째 ${students[idx]}<br>`)
        }

        document.write('<h4>3. for-of문</h4>')
        for(let data of students) {
            document.write(`${data}<br>`)
        }

        document.write('<h4>4. forEach문</h4>')
        students.forEach((student, idx) => {
            document.write(`${idx}번째 ${student}<br>`)
        });

        document.write('<h4>5. forEach문</h4>')
        students.forEach(student => {
            document.write(`${student}<br>`)
        });
    </script>
</head>
<body>
    
</body>
</html>
