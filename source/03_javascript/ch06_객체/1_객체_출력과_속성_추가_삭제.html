<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        var arr = [1, '홍길동']; // arr = {0:1, 1:'홍길동'}으로 인식하여
        arr.push('새로운 값');
        arr.pop();
        // arr[0], arr[1]       // 인덱스 부여 - 배열의 key : index
        document.write('<h3>배열 인덱스 확인</h3>');
        for(let idx in arr) {
            document.write(`${idx}번째(index type:${typeof(idx)}) - ${arr[idx]}<br>`);
        }
        var obj = {'name':'홍길동','age':20}; 
        // obj['name'], obj['age'] // 객체의 key : 속성변수
        document.write('<h3>객체 속성 추가 전</h3>');
        for(let key in obj) {
            document.write(`${key}(key type: ${typeof(key)}) - ${obj[key]}<br>`);
        }
        obj.address = '신림동';
        obj.hobby = '노래';
        document.write('<h3>객체 속성 추가 후</h3>');
        for(let key in obj) {
            document.write(`${key}(key type: ${typeof(key)}) - ${obj[key]}<br>`);
        }
        delete(obj.age); // 객체 속성 제거
                document.write('<h3>객체 속성 제거 후</h3>');
        for(let key in obj) {
            document.write(`${key}(key type: ${typeof(key)}) - ${obj[key]}<br>`);
        }
    </script>
</head>

</body>
</html>
