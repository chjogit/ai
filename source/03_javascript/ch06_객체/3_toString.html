<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style></style>
    <script>
        let person = {
            name : '홍길동',
            age : 20,
            eat : function(food) {
                let msg = `${this.age}세 ${this.name}님은 ${food}을(를) 먹습니다.`;
                document.write(msg + '<br>');
            }, // eat
            toString : function() {
                let output = ''; // return할 문자열
                for(let key in this) {
                    if(key!='eat' && key!='toString'){
                        output += key + ' : ' + this[key] + '<br>';
                    } // if
                } // for
                return output;
            } // toString
        }; // person
        person.nickname = '도사';
        document.write(person);
    </script>
</head>
<body>
    
</body>
</html>
