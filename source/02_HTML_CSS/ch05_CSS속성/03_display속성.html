<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        div { width:100px; height:100px; border:1px solid;}
        div:nth-child(1){background-color:red; margin:10px;}
        div:nth-child(2){background-color:green; display:block;}
        div:nth-child(3){background-color:blue; display:inline; /*inline : width / height 설정 불가*/
                         margin:20px;}
        div:nth-child(4){display:none;} /* 화면 미출력 */
        div:nth-child(5){background-color:orange; display:inline-block;} /* 'float : left'와 같은 효과*/
        div:nth-child(6){background-color:yellow; display:inline-block;} /* 유의사항 : enter/tab 등의 영향을 받음 */
    </style>
</head>
<body>
    <div>content1</div>
    <div>content2</div>
    <div>content3</div>
    <div>content4</div>
    <div>content5</div> <!-- innline block 유의사항 예시-->
    <div>content6</div>
    <div>content7</div>
</body>
</html>
