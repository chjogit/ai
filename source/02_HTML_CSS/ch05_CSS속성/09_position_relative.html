<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        #container {
            width:100px;
            margin:0 auto;
            position:relative; /*상대 좌표(기존 위치 기준에서 위치 조정)*/
            left:30px; top:30px;
        }
        #green {
            background-color: green;
            width: 100px;
            height: 100px;
            position:absolute;
            top:0; left:0;
            opacity:0.5;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="green"></div>
        <div id="TEXT">TEXT</div>
    </div>
</body>
</html>
