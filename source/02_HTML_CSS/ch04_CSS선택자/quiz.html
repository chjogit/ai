<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>
    #header, #content, #footer{
      width:1000px; margin:0 auto;
      overflow:hidden;
    }
    #header>div, #content>div, #footer>div{
      float:left;
      border:1px solid gray;
      background-color:lightgray;
    }
    #nav ul {overflow:hidden; 
        width:500px;
        margin:50px auto;
    }
    #nav ul li {
        width:33%;
        list-style:none;
        float:left;
        list-style: none;
        text-align: center;
        font-weight: bold;
    }
      #nav ul li a {
          text-decoration: none;
          color:black;
          font-size:1.5em;
      }

      #academy h2, p {
          margin:40px;
          text-align:center;
      }

      #content .right li:nth-child(9) ~ li {
          color: red;
      }


    .left, .right{width:150px; height:150px;}
    .center {width:692px; height:150px; }
    #content>div{height:300px}
    #header .left, #footer .right {border-radius: 30px 0 30px 0;}
    #header .right, #footer .left {border-radius: 0 30px 0 30px;}
    #content .center {border-radius: 30px;}
    #content .left {border-radius: 0 30px 30px 0;}
    #content .right {border-radius: 30px 0 0 30px;}
    #header .center {border-radius: 0 0 30px 30px;}
    #footer .center {border-radius: 30px 30px 0 0;}
  </style>
</head>
<body>
  <div id="header">
    <div class="left"></div>
    <div class="center"></div>
    <div class="right"></div>
  </div>
  <div id="content">
    <div class="left"></div>
    <div class="center">
      <div id="nav">
        <ul>
          <li><a href="#1">menu1</a></li>
          <li><a href="#2">menu2</a></li>
          <li><a href="#3">menu3</a></li>
        </ul>
      </div>
      <div id="academy">
        <h2>AI 개발자 양성과정</h2>
        <p>파이썬, 웹표준, DBMS, 딥러닝, 자연어처리, 생성형 ai, 머신러닝, 프로젝트, 웹프레임워크</p>
      </div>
    </div>
    <div class="right">
      <ol>
        <li>태그</li>
        <li>전체(*)</li>
        <li>#id, .class</li>
        <li>속성</li>
        <li>후손,자손(>)</li>
        <li>동위+~</li>
        <li>반응</li>
        <li>상태</li>
        <li>구조</li>
        <li>문자</li>
        <li>링크</li>
        <li>부정</li>
      </ol>
    </div>
  </div>
  <div id="footer">
    <div class="left"></div>
    <div class="center"></div>
    <div class="right"></div>
  </div>
</body>
</html>
