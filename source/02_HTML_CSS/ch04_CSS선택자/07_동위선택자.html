<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        /* h3 태그 뒤에 오는 모든 div 동위 태그 */
        h3~div {
            color: orange;
            font-weight: bold;
        }

        /* h3 태그 바로 다음에 오는 div 동위 태그 하나만 선택 */
        h3 + div {
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div>div_00</div>
    <h3>동위선택자 (+: 바로 다음 동위 태그, ~: 다음 동위 태그 전체)</h3>
    <div>div_01</div>
    <div>div_02</div>
    <div>div_03</div>
    <div>div_04</div>
    <div>div_05</div>
</body>
</html>
