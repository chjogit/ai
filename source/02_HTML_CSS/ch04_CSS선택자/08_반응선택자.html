<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        table {
            border-collapse:collapse;
        }
        td ,th {
            border:1px solid;
            text-align:center;
        }
        tr {
            background-color:lightblue;
        }
        tr:hover{
            background-color:lightyellow;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>글번호</th>
                <th>글제목</th>
                <th>글쓴이</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>9</td>
                <td>제목</td>
                <td>홍길동</td>
            </tr>
            <tr>
                <td>7</td>
                <td>목요일</td>
                <td>김길동</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
