<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        input:focus {
            background-color:lightgray;
            border:1px solid black;
            outline:none;
        }
        input:enabled{
            color:green;
        }
        input:disabled{
            color:black;
        }
        input:read-only{
            color:red;
        }
    </style>
</head>
<body>
    <form>
        이름 <input type="text" name="name" /><br />
        아이디 <input type="text" name="id" /><br />
        시급 <input type="text" name="sal" value="11000" disabled="disabled" /><br />
        생일 <input type="text" name="birth" value="981212" readonly="readonly" /><br />
        <input type="submit" />
    </form>
</body>
</html>
