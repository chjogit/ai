<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        input { color: green; }
        input[type='password']{ /*type='password'인 태그*/
            color:black;
        }
        input[type^='te']{ /*type='te'로 시작하는 태그*/
            color:orange; width:100px
        }
        input[name$='me']{ /*type='me'로 끝나는 태그*/
            border:1px solid red;
            padding:10px;
            outline:0; /*input 태그가 focus 되었을 때 나타나는 border*/
        }
        img[alt] {width:50px; border:1px solid blue;} /*alt 속성이 있는 img*/
    </style>
</head>
<body>
    <form>
        성명<input type="text" name="name" /><br />
        아이디<input type="text" name="id" /><br />
        비밀번호<input type="password" name="pw" /><br />
        전화번호<input type="tel" name="tel" /><br />
        <img src="ch04/sulhyun.jpg" />
        <img src="ch04/sulhyun.jpg" alt="설현" />
        <input type="submit" />
    </form>
</body>
</html>
