<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        table {
            margin: 100px auto;
        }
        td {
            padding:5px ;
        }
        input {
            text-align:center;
        }
    </style>
</head>
<body>
    <form action="" method="get">
        <table>
            <tr>
                <td>ID</td>
                <td>
                    <input type="hidden" name="data" value="숨겨서 보냄" />
                    <input type="text" name="username" autocomplete="off" />
                    <input type="button" value="중복확인" />
                </td>
            </tr>
            <tr>
                <td>PW</td>
                <td><input type="password" name="userpw" /></td>
            </tr>
            <tr>
                <td>P/N</td>
                <td>
                    <select name="선택">
                        <option>010</option>
                        <option>011</option>
                    </select>
                    - <input type="text" name="userpn2" size="2" />
                - <input type="text" name="userpn3" size="2" /></td>
            </tr>
            <tr>
                <td>경력</td>
                <td><input type="number" name="career" min="0" max="60" value="0" /></td>
            </tr>
            <tr>
                <td>이메일</td>
                <td><input type="email" name="useremail" /></td>
            </tr>
            <tr>
                <td>사진</td>
                <td><input type="file" name="userpic" /></td>
            </tr>
            <tr>
                <td>성별</td>
                <td>
                    <input type="radio" name="gender" value="m" />남
                    <input type="radio" name="gender" value="f" />여
                </td>
            </tr>
            <tr>
                <td>생년월일</td>
                <td><input type="date" name="birth" /></td>
            </tr>
            <tr>
                <td>나이</td>
                <td><input type="range" name="age" min="0" max="100" step="10" value="20"/></td>
            </tr>
            <tr>
                <td>국적</td>
                <td>
                    <select name="nation">
                        <option value="대한민국">대한민국</option>
                        <option>일본</option>
                        <option>중국</option>
                        <option>미국</option>
                        <option>인도</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>사용언어</td>
                <td>
                    <input type="checkbox" name="lang" value="kor" />한국어
                    <input type="checkbox" name="lang" value="eng" />영어
                    <input type="checkbox" name="lang" value="jap" />일본어
                </td>
            </tr>
            <tr>
                <td>선호하는 음식</td>
                <td>
                    <select name="food" multiple="multiple" size="2">
                        <option>한식</option>
                        <option>양식</option>
                        <option>중식</option>
                        <option selected="selected">일식</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>자기소개</td>
                <td><textarea name="info" cols="25" rows="3"></textarea></td>
            </tr>
            <tr>
                <td>SNS</td>
                <td><input type="url" name="snsurl" value="https://"/></td>
            </tr>
            <tr>
                <th colspan="2">
                    <input type="submit" value="입력" />
                    <input type="reset" value="초기화" />
                </th>
            </tr>
        </table>
    </form>
</body>
</html>
