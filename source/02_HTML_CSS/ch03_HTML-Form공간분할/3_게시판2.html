<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        span {
            color:red;
            font-weight:bolder;
        }
        table {
            margin: 100px auto;
            border-collapse: collapse; /* tr/td의 경계를 구분 지어줌 */
        }
        tr {
            border-top: 1px solid green;
            border-bottom: 1px solid green;
        }
        td, th {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <form> 
        <table>
            <caption><h2>게시글 작성</h2></caption>
            <tr>
                <td>제목<span>*</span></td>
                <td><input type="text" name="title" size="30" required="required" /></td> 
                    <!--required="required" : 필수 입력/선택 사항임을 나타내는 속성-->
            </tr>
            <tr>
                <td>작성자<span>*</span></td>
                <td><input type="text" name="uname" size="30" required="required" minlength="2"/></td>
            </tr>
            <tr>
                <td>본문</td>
                <td><textarea name="content" cols="30" rows="5"></textarea></td>
            </tr>
            <tr>
                <td>첨부파일</td>
                <td style="text-align: center;"><input type="file" name="file" /></td>
            </tr>
            <tr>
                <th colspan="2">
                    <input type="submit" value="작성"/>
                    <input type="reset"/>
                </th>
            </tr>
        </table>
    </form>
</body>
</html>
