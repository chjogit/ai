<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        p, li, div, h1, span{border:1px solid gray;}
        ul{border:1px solid lightgray;}
    </style>
</head>
<body>
    <p>블록형 태그</p>
    <ul>
        <li>item1</li>
        <li>item1</li>
        <li>item1</li>  <!-- 들여쓰기 생성 ; 공간 분할형 태그로 부적합 -->
    </ul>
    <h1>tests</h1> <!-- 바깥 여백 생성 ; 공간 분할형 태그로 부적합 -->
    <div>block1</div><div>block1</div><div>block1</div> <!-- 공간 분할형 태그로 적합 -->
    <p>라인형 태그</p>
    <span>inline1</span>
    <span>inline1</span>
    <span>inline1</span>
</body>
</html>
