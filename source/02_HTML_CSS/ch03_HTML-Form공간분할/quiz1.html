<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="quiz1.css" rel="stylesheet" />
    <script>
        function chk() {
            if (frm.pw.value != frm.pwchk.value) {
                alert("비밀번호를 확인하세요");
                frm.pw.value = '';
                frm.pwchk.value = '';
                frm.pw.focus();
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <header>
        <h1>회원가입</h1>
    </header>
    <section>
        <form name="frm" onsubmit="return chk()">
            <fieldset>
                <legend>필수입력</legend>
                <table>
                    <tr>
                        <td><label for="name">이 름<span>*</span></label></td>
                        <td><input type="text" name="name" id="name" required="required" 
                                   placeholder="이름은 2글자 이상" minlength="2" pattern="[가-힣]{2,4}" 
                                   autofocus="autofocus" autocomplete="off"/></td>
                    </tr>
                    <tr>
                        <td><label for="id">아이디<span>*</span></label></td>
                        <td><input type="text" name="id" id="id" required="required" 
                                   placeholder="ID는 4글자 이상" minlength="4" pattern=[a-zA-Z0-9가-힣]{4,} /></td>
                    </tr>
                    <tr>
                        <td><label for="pw">비밀번호<span>*</span></label></td>
                        <td><input type="password" name="pw" id="pw" required="required" 
                                   minlength="1"/></td>
                    </tr>
                    <tr>
                        <td><label for="pwchk">비번확인<span>*</span></label></td>
                        <td><input type="password" name="pwchk" id="pwchk" required="required" 
                                   minlength="1"/></td>
                    </tr>
                    <tr>
                        <td><label for="tel">전화<span>*</span></label></td>
                        <td>
                            <input type="tel" name="tel" id="tel" required="required" 
                                   placeholder="xx-xxx-xxxx/000-0000-0000"
                                   pattern="^01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}$"
                                   oninput="this.value = this.value.replace(/[^0-9\-\s\.]/g, '');" />
                        </td>
                    </tr>
                    <tr>
                        <td><label for="email">이메일<span>*</span></label></td>
                        <td>
                            <input type="text" name="email" id="email" required="required"
                                   placeholder="id@domain.com 또는 co.kr" pattern="\w+@\w+\.\w+\.?\w+" />
                        </td>
                    </tr>
                </table>
            </fieldset>
            <fieldset>
                <legend>추가 입력 사항</legend>
                <table>
                    <tr>
                        <td>결혼 유 무</td>
                        <td>
                            <input type="radio" name="marriage" value="yes">기혼
                            <input type="radio" name="marriage" value="no">미혼
                        </td>
                    </tr>
                    <tr>
                        <td>자식</td>
                        <td>
                            <input type="checkbox" name="child" value="s">아들
                            <input type="checkbox" name="child" value="d">딸
                        </td>
                    </tr>
                    <tr>
                        <td>지역</td>
                        <td>
                            <select name="region">
                                <option value="서울">서울</option>
                                <option>경기</option>
                                <option>경상</option>
                                <option>충청</option>
                                <option>강원</option>
                                <option>전라</option>
                                <option>대구</option>
                                <option>광주</option>
                                <option>부산</option>
                                <option>울산</option>
                                <option>세종</option>
                                <option>인천</option>
                                <option>대전</option>
                                <option>제주</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </fieldset>
            <p>
                <input type="submit" value="가입" />
                <input type="reset" value="취소" />
            </p>
        </form>
        <br />
    <hr />
    </section>
    <footer>
        <br />
        <p>
            서울시 관악구 신림로 364, 우장BD 503호<br />
            Copyright © XX All rights reserved
        </p>
    </footer>
</body>
</html>
