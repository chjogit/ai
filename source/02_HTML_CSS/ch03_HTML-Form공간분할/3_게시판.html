<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        span {
            color:red;
            font-weight:bolder;
        }
        table {
            margin: 100px auto;
            border-collapse: collapse; /* tr/td의 경계를 구분 지어줌 */
        }
        tr {
            border-top: 1px solid green;
            border-bottom: 1px solid green;
        }
        td, th {
            padding: 5px 10px;
        }
    </style>
    <script>
        function chk() {
            /* 
            frm.title.value(필수입력), frm.name.value(2글자 이상) ; 유효성 검사
            */
            if (!frm.title.value.trim()) { //빈문자 또는 space만 입력
                alert('제목을 입력하세요.');
                frm.title.value = '';
                frm.title.focus(); // frm.title에 포커스
                return false;
            }
            else if (frm.uname.value.trim().length < 2) { // 1글자 이하일 경우 조건문 발동
                alert('작성자명은 2글자 이상 입력하세요.');
                frm.uname.value = frm.uname.value.trim()
                frm.uname.focus();
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <form name="frm" onsubmit="return chk()"> 
        <table>
            <caption><h2>게시글 작성</h2></caption>
            <tr>
                <td>제목<span>*</span></td>
                <td><input type="text" name="title" size="30" /></td>
            </tr>
            <tr>
                <td>작성자<span>*</span></td>
                <td><input type="text" name="uname" size="30" /></td>
            </tr>
            <tr>
                <td>본문</td>
                <td><textarea name="content" cols="30" rows="5"></textarea></td>
            </tr>
            <tr>
                <td>첨부파일</td>
                <td style="text-align: center;"><input type="file" name="file" /></td>
            </tr>
            <tr>
                <th colspan="2">
                    <input type="submit" value="작성"/>
                    <input type="reset"/>
                </th>
            </tr>
        </table>
    </form>
</body>
</html>
