<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        fieldset {
            margin: auto;
        }
        span {
            color:red;
        }
        p {
            text-align:center;
        }
    </style>
</head>
<body>
    <form>
       <fieldset>
           <legend>필드 유효성 검사</legend>
           <ul>
               <li>
                   <label for="name">이름<span>*</span></label>
                   <input type="text" name="name" id="name" required="required" autofocus="autofocus" placeholder="성명" pattern="[가-힣]{2,4}"/>
               </li>
               <li>
                   <label for="tel">연락처<span>*</span></label>
                   <input type="tel"
                          name="tel"
                          id="tel"
                          required="required"
                          pattern="^01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}$"
                          placeholder="010-0000-0000"
                          oninput="this.value = this.value.replace(/[^0-9\-\s\.]/g, '');" />
               </li>
               <li>
                   <label for="email">이메일<span>*</span></label>
                   <input type="text" name="email" id="email" required="required" placeholder="id@domain" pattern="\w+@\w+\.\w+\.?\w+" />
               </li>
               <li>
                   <label for="birth">생년월일<span>*</span></label>
                   <input type="text" name="birth" id="birth" required="required" placeholder="000000" pattern="\d{2}((0[13578]|1[02])(0[1-9]|[12]\d|3[01])|(0[469]|11)(0[1-9]|[12]\d|30)|02(0[1-9]|[12]\d))" />
               </li>
           </ul>
           <p>
               <input type="submit" value="입력" />
               <input type="reset" />
           </p>
       </fieldset>
    </form>
</body>
</html>
