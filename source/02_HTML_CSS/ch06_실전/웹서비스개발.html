<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="웹서비스개발.css" rel="stylesheet">
</head>
<body>
    <div id="wrap">
    <nav>
        <div id="nav_left">
            <ul>
                <li><a href="#">LOGO</a></li>
                <li><a href="#">참여하기</a></li>
                <li><a href="#">개설하기</a></li>
                <li><a href="#">검색하기</a></li>
            </ul>
        </div>
        <div id="nav_right">
            <ul>
                <li><a href="#">고객센터</a></li>
                <li><a href="#">로그아웃</a></li>
                <li><a href="#">홍길동님</a></li>
            </ul>
        </div>
    </nav>
    <div id="content">
        <div id="title">
            <p>마이페이지</p>
        </div>
        <div id="lnb">
            <ul>
                <li><a href="#">나의 여행</a></li>
                <li><a href="#">참여 여행</a></li>
                <li><a href="#">관심 여행</a></li>
                <li><a href="#">개인정보 변경</a></li>
                <li><a href="#">비밀번호 변경</a></li>
            </ul>
        </div>
        <div id="my_content">
            <div id="sub_title">
                <p>개인정보변경</p>
            </div>
            <div id="modify">
                <form name="frm" onsubmit="return chk()">
                    <table>
                        <tr>
                            <td><label for="name" >이름</td>
                            <td>
                                <input type="text" name="name" id="name" required="required" 
                                    placeholder="홍길동" pattern="[가-힣]{2,}" 
                                    autofocus="autofocus" autocomplete="off"/>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="id" >아이디</td>
                            <td>
                                <input type="text" name="id" id="id" required="required" 
                                    placeholder="ID" pattern="[a-zA-Z가-힣ㄱ-ㅎ0-9]+"/>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="name" >이메일</td>
                            <td>
                                <input type="text" name="email" id="email" required="required"
                                    placeholder="id@domain.com 또는 co.kr" pattern="\w+@\w+\.\w+\.?\w+" />
                            </td>
                        </tr>
                        <tr>
                            <td><label for="tel" >전화</td>
                            <td>
                                <input type="tel" name="tel" id="tel" required="required" 
                                    placeholder="xx-xxx-xxxx/000-0000-0000"
                                    pattern="^01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}$"
                                    oninput="this.value = this.value.replace(/[^0-9\-\s\.]/g, '');" />
                            </td>
                        </tr>
                        <tr>
                            <td><label for="birth" >생년월일</td>
                            <td><input type="date" id="birth" required="required"></td>
                        </tr>
                        <tr>
                            <td><label for="address" >주소</td>
                            <td><input type="text" id="address" required="required"></td>
                        </tr>
                        <tr>
                            <th colspan="2"><input type="submit" value="저장" /></th>
                        </tr>
                    </table>
                </form>
            </div>
        </div>
    </div>
    <footer>
        footer
    </footer>
    </div>
</body>
</html>
