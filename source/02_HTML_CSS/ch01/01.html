<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head><!-- head 영역 : 설정 정보 -->
    <meta charset="utf-8" />
    <title>첫 페이지</title>
        <style> /* 디자인 설정 */
            body {
                background-color: #dddeeb; /* RGB */
                font-size: 30pt;
            }
        </style>
        <script>
            /* 동적 파트 : javascript */
            name = prompt("What's your name?", "Hong, Gil Dong"); // 취소 선택 시 'null' 입력
            if (name != 'null' && name != '') {
                document.write("~ Welcome. " + name + ". ~<br>");
            }
            
        </script>
</head>
<body>
    <!-- body 영역 : 웹브라우저에 출력할 정보 -->
    <br />
    안녕하세요.<br />
    오늘부터 웹표준&nbsp;&nbsp;수업이 시작됩니다. <br />
    Hello, World.
</body>
</html>
