{% extends "base.html" %}
{%block title%}구구단을 외자{%endblock%}

{% block content %}
<div class="p-5 mb-4 bg-body-tertiary rounded-3"> 
    <h1  class="container-fluid py-5">
        구구단을 외자
    </h1>
    <h2 class="container-fluid py-5">
        숫자를 입력하면, 해당 숫자의 구구단이 출력됩니다.
    </h2> 
    <br>
    <form action="{{url_for('index')}}" method="post">
        <div class="input-group">
            <span class="input-group-text">숫자를 입력하세요</span>
            <input type="text" name="no" class="form-control" value="{% if no %}{{no}}{% endif %}">
            <button class="btn btn-outline-secondary" type="submit" id="button-addon2">구구단 출력</button>
        </div>
    </form>
    <br>
    {% if no %}
        {% for i in range(1,10) %}
            <p>{{i}} x {{no}} = {{no|int * i}}</p>
        {% endfor %}
    {% else %}
        <p class="text-danger">입력된 숫자가 없습니다.</p>
    {% endif %}
</div>
{% endblock %}
