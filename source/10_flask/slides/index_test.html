<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 휴대폰에서도 화면 크기에 맞게 보이도록 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1st 프로젝트 포트폴리오</title>
  <style>
    /* 화면 전체를 세로로 쓰기 */
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    /* 상단 제목줄 */
    header { padding: 12px 16px; background: #222; color: #fff;
             display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; }
    /* PDF가 남은 화면을 꽉 채우도록 */
    iframe { flex: 1; width: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <span>7장 Flask 배포 수업 자료</span>
    <!-- 휴대폰에서 PDF가 안 보일 때를 대비한 다운로드 링크 -->
    <a href="assets/slides.pdf" download>PDF 다운로드</a>
  </header>

  <!-- 브라우저 내장 뷰어로 slides.pdf 표시 -->
  <iframe src="assets/slides.pdf"></iframe>
</body>
</html>
