{% extends "base.html" %}
{% block title %}details{% endblock %}
{% block content %}
    <table class="table table-warning table-striped">
      <tbody>
        <tr>
          <th>id</th>
          <td>{{student.id}}</td>
        </tr>
        <tr>
          <th>name</th>
          <td>{{student.name}}</td>
        </tr>
        <tr>
          <th>major(grade)</th>
          <td>{{student.major}}({{student.grade}})</td>
        </tr>
        <tr>
          <th>age</th>
          <td>{{student.age}}</td>
        </tr>
      </tbody>
    </table>
    <button type="button" class="btn btn-primary" onclick="location='/student'">
      list
    </button>
    <button type="button" class="btn btn-primary" onclick="location='/student/delete/{{student.id}}'">
      delete
    </button>
{% endblock %}
